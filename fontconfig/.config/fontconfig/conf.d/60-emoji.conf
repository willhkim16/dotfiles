<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Without this, monospace emoji (e.g. U+1F7E8) fall back to the monochrome
     Noto Sans Symbols 2 before Noto Color Emoji, so Alacritty shows grey cubes. -->
<fontconfig>
  <alias><family>monospace</family><prefer><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
